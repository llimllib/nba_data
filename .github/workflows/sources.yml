name: Update other sources (v2)

# The sources other than stats.nba.com and ESPN (see docs/v2.md). They
# change at most daily, and basketball-reference blocks frequent scrapers,
# so they run once a day rather than with update.yml.
#
# Each source is its own step with continue-on-error, so a markup change on
# one site doesn't stop the others. A source that fails writes nothing (its
# parser validates before writing), so the bucket keeps its last good file.
# Failures are reported per source in an issue titled "<source> scraper
# failed", separate from update.yml's.
#
# To add a source: add a step with an id, and add the id to SOURCES below.

on:
  workflow_dispatch:
    inputs:
      fail_source:
        description: "Make this source's step fail, to test the failure issue (e.g. bbref)"
        required: false
        default: ""
  schedule:
    # 11:17 UTC: after the night's games are final, and off the hour, when
    # GitHub delays and drops scheduled runs the most
    - cron: "17 11 * * *"

# shared with update.yml so the two never rebuild the catalog at once
concurrency:
  group: update-v2
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  BUCKET: basketball-data
  UV_HTTP_TIMEOUT: 600
  # pipeline.output.check_keys drops rows with a duplicate or NULL key and
  # lists them here rather than stopping the run; "Report dropped rows"
  # fails the run after everything else is published
  PIPELINE_DROPPED: /tmp/pipeline-dropped.txt

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # installs python, uv, ruff and ty from mise.toml
      - uses: jdx/mise-action@v5

      # bbref's past seasons are never refetched; only the current season's
      # league page is, once a day
      - name: basketball-reference
        id: bbref
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = bbref ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          uv run python -m pipeline.bbref --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}

      # the current season's 30 team pages (6s apart, so about 3 minutes);
      # past seasons are never refetched
      - name: basketball-reference salaries
        id: bbref_salaries
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = bbref_salaries ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          uv run python -m pipeline.bbref_salaries --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}

      # season and predictive EPM. Only the site's current season is public,
      # so this writes whichever season the site is on
      - name: dunksandthrees EPM
        id: dunksandthrees
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = dunksandthrees ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          uv run python -m pipeline.dunksandthrees --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}

      # OpenRAPM's ratings, every season from 2010 (2 files from GitHub).
      # Each publish recomputes every season, so they're all rewritten when
      # its built date changes, and nothing is written when it hasn't
      - name: OpenRAPM
        id: openrapm
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = openrapm ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          uv run python -m pipeline.openrapm --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}

      # the current season's league summary (2 requests); past seasons are
      # final and never refetched
      - name: Cleaning the Glass
        id: ctg
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = ctg ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          uv run python -m pipeline.ctg --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}

      # ESPN's net points season totals (2 files); the current season only
      - name: ESPN net points totals
        id: espn_net_pts
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = espn_net_pts ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          uv run python -m pipeline.espn_net_pts --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}

      # college games and box scores from ESPN (ncaam/espn/): the current
      # season's new scoreboards and finished games' summaries, about 30-50
      # requests a day in season. The season is built from every saved
      # file, so download them first; sync succeeds when there are none
      - name: ESPN college basketball
        id: ncaam_espn
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = ncaam_espn ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          SEASON=$(uv run python -c 'from pipeline.seasons import current_season, today_eastern; print(current_season(today_eastern()))')
          aws s3 sync "s3://$BUCKET/ncaam/raw/espn/$SEASON/" "out/ncaam/raw/espn/$SEASON/" --no-progress
          uv run python -m pipeline.ncaam_espn --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_ENDPOINT_URL: https://sfo3.digitaloceanspaces.com
          AWS_DEFAULT_REGION: us-east-1

      # barttorvik.com returns 403 to GitHub Actions IPs, so torvik goes
      # through the tailscale exit node, as nba.com does in update.yml
      # (https://til.simonwillison.net/tailscale/tailscale-github-actions).
      # If the exit node isn't available, the torvik step fails and is
      # reported like any other source failure
      - name: Setup Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      # you can't set the exit-node name at 'up' time, so set it afterwards
      # https://github.com/tailscale/github-action/issues/123
      - name: Use the exit node
        id: exit_node
        if: steps.tailscale.outcome == 'success'
        continue-on-error: true
        run: |
          timeout 5m sudo -E tailscale set --exit-node=apple-tv --exit-node-allow-lan-access=true
          online=$(sudo tailscale status --json | jq -r '.ExitNodeStatus.Online // "null"')
          if [ "$online" != "true" ]; then
            echo "exit node apple-tv is not online (status: $online)"
            exit 1
          fi
          curl --max-time 10 -sf https://www.google.com > /dev/null

      # men's college basketball, under ncaam/ with its own catalog. The
      # current season's two CSVs (past seasons are never refetched), and
      # the daily ratings it doesn't have yet. Those are built from every
      # saved day, so download the season's first; sync succeeds when there
      # are none yet
      - name: barttorvik
        id: torvik
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = torvik ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          if [ "$EXIT_NODE" != success ]; then echo "no exit node (tailscale: $TAILSCALE, exit node: $EXIT_NODE), and torvik blocks Actions IPs"; exit 1; fi
          SEASON=$(uv run python -c 'from pipeline.seasons import current_season, today_eastern; print(current_season(today_eastern()))')
          aws s3 sync "s3://$BUCKET/ncaam/raw/torvik/$SEASON/daily/" "out/ncaam/raw/torvik/$SEASON/daily/" --no-progress
          uv run python -m pipeline.torvik --out out
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}
          TAILSCALE: ${{ steps.tailscale.outcome }}
          EXIT_NODE: ${{ steps.exit_node.outcome }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_ENDPOINT_URL: https://sfo3.digitaloceanspaces.com
          AWS_DEFAULT_REGION: us-east-1

      # player stints, from each game's play-by-play and box score on
      # stats.nba.com, which blocks Actions IPs, so through the exit node
      # too. Two requests a game, only for games it doesn't have yet (and
      # the last two days'), but the season is built from every saved game,
      # so download them first. Games that fail are left for the next run,
      # and --minutes keeps a bad day from using up the job's time. The
      # build checks the stints against player_game_logs, from the bucket
      - name: stats.nba.com rotations
        id: rotations
        continue-on-error: true
        run: |
          if [ "$FAIL_SOURCE" = rotations ]; then echo "failing on purpose (fail_source)"; exit 1; fi
          if [ "$EXIT_NODE" != success ]; then echo "no exit node (tailscale: $TAILSCALE, exit node: $EXIT_NODE), and stats.nba.com blocks Actions IPs"; exit 1; fi
          SEASON=$(uv run python -c 'from pipeline.seasons import current_season, today_eastern; print(current_season(today_eastern()))')
          aws s3 sync "s3://$BUCKET/nba/raw/stats/$SEASON/playbyplay/" "out/nba/raw/stats/$SEASON/playbyplay/" --no-progress
          uv run python -m pipeline.rotations --out out --minutes 10
        env:
          FAIL_SOURCE: ${{ inputs.fail_source }}
          TAILSCALE: ${{ steps.tailscale.outcome }}
          EXIT_NODE: ${{ steps.exit_node.outcome }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_ENDPOINT_URL: https://sfo3.digitaloceanspaces.com
          AWS_DEFAULT_REGION: us-east-1

      # everything after this (the upload, the CDN purge, the catalog)
      # goes direct again
      - name: Disable the exit node
        if: always() && steps.tailscale.outcome == 'success'
        run: sudo -E tailscale set --exit-node=

      # check whatever the sources wrote before anything is published. out/
      # has no NBA lookup tables, so they're read from the bucket; the
      # college ones are built by the ESPN college step, along with the
      # only college files that have keys
      - name: Integrity check
        id: check
        run: |
          uv run python -m pipeline.catalog --out out --check --remote-lookups
          uv run python -m pipeline.catalog --out out --check --league ncaam

      # if every source failed before writing anything, out/ doesn't exist
      - name: Upload
        id: upload
        run: |
          mkdir -p out
          aws s3 sync out/ "s3://$BUCKET/" --acl public-read --no-progress --exclude '*.local.duckdb' --exclude '.*' --exclude '*/.*'
        env: &spaces
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_ENDPOINT_URL: https://sfo3.digitaloceanspaces.com
          AWS_DEFAULT_REGION: us-east-1

      # the catalog build reads the files through the CDN, so it must see
      # the ones just uploaded
      - name: Purge the CDN
        id: purge
        run: &purge |
          curl -sf -X DELETE \
            -H "Authorization: Bearer $DO_CDN_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"files": ["nba/*", "ncaam/*"]}' \
            "https://api.digitalocean.com/v2/cdn/endpoints/$DO_CDN_ENDPOINT_ID/cache"
        env: &cdn
          DO_CDN_API_KEY: ${{ secrets.DO_CDN_API_KEY }}
          DO_CDN_ENDPOINT_ID: ${{ secrets.DO_CDN_ENDPOINT_ID }}

      - name: Build and upload the catalog
        id: catalog
        run: |
          uv run python -m pipeline.catalog --out out --bucket "$BUCKET"
          aws s3 cp out/nba/nba.duckdb "s3://$BUCKET/nba/nba.duckdb" --acl public-read --no-progress
          aws s3 cp out/nba/metadata.json "s3://$BUCKET/nba/metadata.json" --acl public-read --content-type application/json --no-progress
        env: *spaces

      # the college data's catalog, ncaam/ncaam.duckdb; nothing in it has NBA
      # keys, so there's nothing for the integrity check to check
      - name: Build and upload the college catalog
        id: catalog_ncaam
        run: |
          uv run python -m pipeline.catalog --out out --bucket "$BUCKET" --league ncaam
          aws s3 cp out/ncaam/ncaam.duckdb "s3://$BUCKET/ncaam/ncaam.duckdb" --acl public-read --no-progress
          aws s3 cp out/ncaam/metadata.json "s3://$BUCKET/ncaam/metadata.json" --acl public-read --content-type application/json --no-progress
        env: *spaces

      - name: Purge the CDN again, for the catalogs
        run: *purge
        env: *cdn

      # rows check_keys dropped: everything else was published, but the run
      # fails so the notifier reports them
      - name: Report dropped rows
        id: dropped
        if: always()
        run: |
          if [ -s "$PIPELINE_DROPPED" ]; then
            cat "$PIPELINE_DROPPED"
            echo "::error::rows with a duplicate or NULL key were dropped"
            exit 1
          fi

      # one issue per source: comment on its open issue, or file one. Then
      # fail the run, so it shows red in Actions too
      - name: Report failed sources
        if: always()
        uses: actions/github-script@v9.0.0
        env:
          SOURCES: |
            {"basketball-reference": "${{ steps.bbref.outcome }}",
             "basketball-reference salaries": "${{ steps.bbref_salaries.outcome }}",
             "dunksandthrees": "${{ steps.dunksandthrees.outcome }}",
             "openrapm": "${{ steps.openrapm.outcome }}",
             "cleaningtheglass": "${{ steps.ctg.outcome }}",
             "espn-net-points": "${{ steps.espn_net_pts.outcome }}",
             "barttorvik": "${{ steps.torvik.outcome }}",
             "stats-nba-rotations": "${{ steps.rotations.outcome }}",
             "espn-college": "${{ steps.ncaam_espn.outcome }}"}
        with:
          script: |
            const outcomes = JSON.parse(process.env.SOURCES);
            const failed = Object.keys(outcomes).filter(s => outcomes[s] === 'failure');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });
            for (const source of failed) {
              const title = `${source} scraper failed`;
              const body = `The ${source} step failed in ${runUrl}. Nothing was written for it, ` +
                `so the bucket still has its last good data. The step's log has the parser's ` +
                `error; the raw page is kept under \`nba/raw/\` (if it was fetched).`;
              const existing = open.find(i => i.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
              }
            }
            if (failed.length) core.setFailed(`failed sources: ${failed.join(', ')}`);

      # anything else failing (check, upload, catalog) is a pipeline problem,
      # not a source's: the same notifier as update.yml, whether or not a
      # source also failed
      - name: Notify on failure
        if: >-
          always() && (steps.check.outcome == 'failure' || steps.upload.outcome == 'failure'
          || steps.purge.outcome == 'failure' || steps.catalog.outcome == 'failure'
          || steps.catalog_ncaam.outcome == 'failure' || steps.dropped.outcome == 'failure')
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueTitle = 'Data update (v2) workflow failed';
            const fs = require('fs');
            const dropped = fs.existsSync(process.env.PIPELINE_DROPPED)
              ? fs.readFileSync(process.env.PIPELINE_DROPPED, 'utf8').trim() : '';
            const detail = dropped
              ? `\n\nRows dropped for a duplicate or NULL key (everything else was published):\n\`\`\`\n${dropped}\n\`\`\``
              : '';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            });
            const existingIssue = issues.data.find(issue => issue.title === issueTitle);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another failure detected in workflow run (sources.yml): ${runUrl}${detail}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: `Workflow run failed (sources.yml): ${runUrl}\n\nPlease check the workflow logs for details.${detail}`
              });
            }
