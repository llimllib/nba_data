name: Update data (v2)

# Runs the v2 pipelines and publishes to the basketball-data Space; see
# docs/v2.md. Runs alongside dl.yml (v1) until cutover, offset by 30 minutes
# so the two don't hit stats.nba.com through the exit node at once

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */4 * * *"

concurrency:
  group: update-v2
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  BUCKET: basketball-data
  # sometimes uv fails when downloading packages; increase its timeout
  UV_HTTP_TIMEOUT: 600
  # pipeline.output.check_keys drops rows with a duplicate or NULL key and
  # lists them here rather than stopping the run; "Report dropped rows"
  # fails the run after everything else is published
  PIPELINE_DROPPED: /tmp/pipeline-dropped.txt
  # browsers revalidate every file on every load (a 304 if it hasn't
  # changed) and the CDN caches it for an hour (purged after each upload).
  # Without max-age=0, a browser can keep part of a file and combine it with
  # ranges of the next version, so a parquet reader finds a bad footer
  CACHE_CONTROL: "public, max-age=0, must-revalidate, s-maxage=3600"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # installs python, uv, ruff and ty from mise.toml
      - uses: jdx/mise-action@v5

      - name: Current season
        run: echo "SEASON=$(uv run python -c 'from pipeline.seasons import current_season, today_eastern; print(current_season(today_eastern()))')" >> "$GITHUB_ENV"

      # pipeline.stats refetches the team rosters (30 requests) only when the
      # saved ones are a day old, so start from the bucket's. sync, unlike cp,
      # succeeds when there are none yet
      - name: Download this season's rosters
        run: aws s3 sync "s3://$BUCKET/nba/raw/stats/$SEASON/" "out/nba/raw/stats/$SEASON/" --exclude '*' --include team_rosters.json.gz --no-progress
        env: &spaces
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_ENDPOINT_URL: https://sfo3.digitaloceanspaces.com
          AWS_DEFAULT_REGION: us-east-1

      # nba.com doesn't let me use a github actions IP, so route through tailscale
      # https://til.simonwillison.net/tailscale/tailscale-github-actions
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      # you can't set the exit-node name at 'up' time, so set it afterwards
      # https://github.com/tailscale/github-action/issues/123
      - name: Use the exit node
        run: |
          timeout 5m sudo -E tailscale set --exit-node=apple-tv --exit-node-allow-lan-access=true
          online=$(sudo tailscale status --json | jq -r '.ExitNodeStatus.Online // "null"')
          if [ "$online" != "true" ]; then
            echo "exit node apple-tv is not online (status: $online)"
            exit 1
          fi
          curl --max-time 10 -sf https://www.google.com > /dev/null

      - name: Fetch NBA stats
        run: uv run python -m pipeline.stats --out out

      # player stints and play-by-play, for the games in the games table just
      # built (so a night's games are fetched in the first run that has
      # them). Two requests a game, only for games it doesn't have yet (and
      # the last two days'), but the season is built from every saved game,
      # so download them first. Games that fail are left for the next run,
      # and --minutes keeps a bad day from using up the job's time. A failure
      # here doesn't stop the rest from publishing; it's reported at the end
      - name: Rotations
        id: rotations
        continue-on-error: true
        run: |
          aws s3 sync "s3://$BUCKET/nba/raw/stats/$SEASON/playbyplay/" "out/nba/raw/stats/$SEASON/playbyplay/" --no-progress
          uv run python -m pipeline.rotations --out out --minutes 10
        env: *spaces

      # ESPN is on AWS and doesn't block Actions IPs
      - name: Disable the exit node
        if: always()
        run: sudo -E tailscale set --exit-node=

      # the ESPN pipeline only fetches days it doesn't have (plus today and
      # yesterday), and ESPN's past days can lose data, so start from ours.
      # Spaces credentials are only set on the steps that need them: the ESPN
      # pipeline uses boto3 too, and AWS_ENDPOINT_URL would redirect it
      - name: Download this season's ESPN files
        run: aws s3 sync "s3://$BUCKET/nba/raw/espn/$SEASON/" "out/nba/raw/espn/$SEASON/" --no-progress
        env: *spaces

      - name: Fetch ESPN data
        run: uv run python -m pipeline.espn --out out

      # check this run's files before anything is published
      - name: Integrity check
        run: uv run python -m pipeline.catalog --out out --check

      - name: Upload
        run: aws s3 sync out/ "s3://$BUCKET/" --acl public-read --cache-control "$CACHE_CONTROL" --no-progress --exclude '*.local.duckdb'
        env: *spaces

      # the catalog build reads the files through the CDN, so it must see the
      # ones just uploaded
      - name: Purge the CDN
        run: &purge |
          curl -sf -X DELETE \
            -H "Authorization: Bearer $DO_CDN_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"files": ["nba/*"]}' \
            "https://api.digitalocean.com/v2/cdn/endpoints/$DO_CDN_ENDPOINT_ID/cache"
        env: &cdn
          DO_CDN_API_KEY: ${{ secrets.DO_CDN_API_KEY }}
          DO_CDN_ENDPOINT_ID: ${{ secrets.DO_CDN_ENDPOINT_ID }}

      # lists every season's files in the bucket and checks them all again
      - name: Build and upload the catalog
        run: |
          uv run python -m pipeline.catalog --out out --bucket "$BUCKET"
          aws s3 cp out/nba/nba.duckdb "s3://$BUCKET/nba/nba.duckdb" --acl public-read --cache-control "$CACHE_CONTROL" --no-progress
          aws s3 cp out/nba/metadata.json "s3://$BUCKET/nba/metadata.json" --acl public-read --cache-control "$CACHE_CONTROL" --content-type application/json --no-progress
        env: *spaces

      - name: Purge the CDN again, for the catalog
        run: *purge
        env: *cdn

      # rows check_keys dropped: everything else was published, but the run
      # fails so the notifier reports them
      - name: Report dropped rows
        id: dropped
        if: always()
        run: |
          if [ -s "$PIPELINE_DROPPED" ]; then
            cat "$PIPELINE_DROPPED"
            echo "::error::rows with a duplicate or NULL key were dropped"
            exit 1
          fi

      - name: Report a rotations failure
        if: always() && steps.rotations.outcome == 'failure'
        run: |
          echo "::error::the rotations step failed; the other files were published"
          exit 1

      # if there's a failure, comment on the open failure issue or file one,
      # to avoid an avalanche of tickets when something breaks
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const issueTitle = 'Data update (v2) workflow failed';
            const fs = require('fs');
            const dropped = fs.existsSync(process.env.PIPELINE_DROPPED)
              ? fs.readFileSync(process.env.PIPELINE_DROPPED, 'utf8').trim() : '';
            const detail = dropped
              ? `\n\nRows dropped for a duplicate or NULL key (everything else was published):\n\`\`\`\n${dropped}\n\`\`\``
              : '';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            });
            const existingIssue = issues.data.find(issue => issue.title === issueTitle);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another failure detected in workflow run: ${runUrl}${detail}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: `Workflow run failed: ${runUrl}\n\nPlease check the workflow logs for details.${detail}`
              });
            }
